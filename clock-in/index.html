<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Online Staff Attendance & Clock-In System</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🕒</text></svg>">
  <style>
    :root {
      --primary: #3b82f6;
      --primary-dark: #1d4ed8;
      --success: #10b981;
      --success-dark: #059669;
      --warning: #f59e0b;
      --warning-dark: #d97706;
      --purple: #8b5cf6;
      --purple-dark: #7c3aed;
      --bg-gradient: linear-gradient(135deg, #090d16 0%, #0f172a 50%, #1e293b 100%);
      --card-bg: rgba(255, 255, 255, 0.96);
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    body {
      background: var(--bg-gradient);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 28px 16px 60px;
      color: var(--text-main);
    }
    .wrapper {
      width: 100%;
      max-width: 520px;
    }
    .app-header {
      text-align: center;
      margin-bottom: 22px;
      color: #ffffff;
    }
    .app-title {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.5px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 8px;
    }
    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.35);
      color: #34d399;
      font-size: 13px;
      font-weight: 600;
      padding: 5px 14px;
      border-radius: 999px;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 10px #10b981;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.45; transform: scale(0.85); }
    }
    .clock-card {
      background: #090d16;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 22px;
      padding: 24px 20px;
      text-align: center;
      margin-bottom: 20px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.45);
    }
    .clock-date {
      color: #94a3b8;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }
    .clock-time {
      color: #38bdf8;
      font-size: 48px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      letter-spacing: 2px;
      text-shadow: 0 0 24px rgba(56, 189, 248, 0.35);
      line-height: 1.1;
    }
    .main-card {
      background: var(--card-bg);
      backdrop-filter: blur(14px);
      border-radius: 24px;
      padding: 26px 22px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      margin-bottom: 20px;
    }
    .form-group {
      margin-bottom: 18px;
    }
    label {
      display: block;
      font-size: 14px;
      font-weight: 700;
      color: #334155;
      margin-bottom: 8px;
    }
    .input-box {
      width: 100%;
      padding: 13px 16px;
      font-size: 15px;
      border: 1.5px solid var(--border);
      border-radius: 14px;
      outline: none;
      background: #f8fafc;
      color: #0f172a;
      transition: all 0.2s;
    }
    .input-box:focus {
      background: #ffffff;
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.12);
    }
    .btn-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 10px;
    }
    .btn-clock {
      border: none;
      border-radius: 16px;
      padding: 16px 14px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      color: #ffffff;
      transition: transform 0.1s, opacity 0.2s, box-shadow 0.2s;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.12);
    }
    .btn-clock:active {
      transform: scale(0.97);
    }
    .btn-clock:disabled {
      opacity: 0.55;
      cursor: not-allowed;
      transform: none !important;
    }
    .btn-clock .icon {
      font-size: 24px;
    }
    .btn-clock .sub-text {
      font-size: 11px;
      opacity: 0.9;
      font-weight: normal;
    }
    .btn-clock-in {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
    }
    .btn-clock-out {
      background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
    }
    .btn-out-temp {
      background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
    }
    .btn-back-temp {
      background: linear-gradient(135deg, #8b5cf6 0%, #7c3aed 100%);
    }
    .msg-box {
      margin-top: 20px;
      padding: 16px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.6;
      display: none;
      animation: fadeIn 0.3s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .msg-success {
      display: block;
      background: #ecfdf5;
      border: 1.5px solid #a7f3d0;
      color: #065f46;
    }
    .msg-error {
      display: block;
      background: #fef2f2;
      border: 1.5px solid #fecaca;
      color: #991b1b;
    }
    .history-card {
      background: var(--card-bg);
      border-radius: 24px;
      padding: 24px 20px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      margin-bottom: 20px;
    }
    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      flex-wrap: wrap;
      gap: 8px;
    }
    .history-title {
      font-size: 16px;
      font-weight: 800;
      color: #1e293b;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .action-links {
      display: flex;
      gap: 6px;
    }
    .pill-btn {
      font-size: 12px;
      text-decoration: none;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 6px 12px;
      border-radius: 999px;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
    }
    .sheet-link-btn {
      color: #2563eb;
      background: #eff6ff;
    }
    .sheet-link-btn:hover {
      background: #dbeafe;
    }
    .csv-btn {
      color: #059669;
      background: #ecfdf5;
    }
    .csv-btn:hover {
      background: #d1fae5;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    th, td {
      padding: 10px 8px;
      text-align: left;
      border-bottom: 1px solid #f1f5f9;
    }
    th {
      color: var(--text-muted);
      font-weight: 700;
      background: #f8fafc;
      font-size: 12px;
    }
    .badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 700;
    }
    .badge-in { background: #d1fae5; color: #065f46; }
    .badge-out { background: #dbeafe; color: #1e40af; }
    .badge-warn { background: #fef3c7; color: #92400e; }
    .badge-purple { background: #ede9fe; color: #5b21b6; }
    .footer-note {
      text-align: center;
      font-size: 13px;
      color: #94a3b8;
      margin-top: 20px;
    }
    .footer-note a {
      color: #38bdf8;
      text-decoration: none;
    }
    .footer-note a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <header class="app-header">
      <div class="app-title">🏢 Staff Attendance System</div>
      <div class="status-pill">
        <span class="status-dot"></span>
        <span>Google Cloud & Web Client Active</span>
      </div>
    </header>

    <div class="clock-card">
      <div class="clock-date" id="clockDate">Synchronizing time...</div>
      <div class="clock-time" id="clockTime">00:00:00</div>
    </div>

    <div class="main-card">
      <div class="form-group">
        <label for="empName">Employee Name <span style="color:#ef4444">*</span></label>
        <select id="empName" class="input-box" style="cursor:pointer;" onchange="handleNameChange(this.value)">
          <option value="" disabled selected>👉 Select your name</option>
          <option value="Alex Wentz">👤 Alex Wentz</option>
          <option value="Sarah Connor">👤 Sarah Connor</option>
          <option value="Michael Scott">👤 Michael Scott</option>
          <option value="David Miller">👤 David Miller</option>
          <option value="Emily Watson">👤 Emily Watson</option>
          <option value="__custom__">✏️ Enter custom name...</option>
        </select>
        <input type="text" id="customNameInput" class="input-box" placeholder="Enter full employee name" style="margin-top: 10px; display: none;">
      </div>

      <div class="form-group">
        <label for="empNote">Notes (Optional)</label>
        <input type="text" id="empNote" class="input-box" placeholder="e.g., Regular shift, Client meeting, Remote / WFH">
      </div>

      <div class="btn-grid">
        <button type="button" class="btn-clock btn-clock-in" onclick="handleClock('Clock In')">
          <span class="icon">☀️</span>
          <span>Clock In</span>
          <span class="sub-text">Start your workday</span>
        </button>

        <button type="button" class="btn-clock btn-clock-out" onclick="handleClock('Clock Out')">
          <span class="icon">🌙</span>
          <span>Clock Out</span>
          <span class="sub-text">Wrap up & sign out</span>
        </button>

        <button type="button" class="btn-clock btn-out-temp" onclick="handleClock('Out of Office')">
          <span class="icon">💼</span>
          <span>Out of Office</span>
          <span class="sub-text">Client visit / field duty</span>
        </button>

        <button type="button" class="btn-clock btn-back-temp" onclick="handleClock('Back to Office')">
          <span class="icon">🏢</span>
          <span>Back to Office</span>
          <span class="sub-text">Return to workstation</span>
        </button>
      </div>

      <div id="statusBox" class="msg-box"></div>
    </div>

    <div class="history-card">
      <div class="history-header">
        <div class="history-title">📋 Recent Attendance Log</div>
        <div class="action-links">
          <button type="button" class="pill-btn csv-btn" onclick="exportCSV()">📥 Export CSV</button>
          <a class="pill-btn sheet-link-btn" href="https://docs.google.com/spreadsheets/d/1R0ebkEe-XHL-KWfoAc6Sm7QknuPqQI54ZO_Q__ixaRU/edit" target="_blank">
            Spreadsheet ↗
          </a>
        </div>
      </div>
      <table>
        <thead>
          <tr>
            <th>Employee</th>
            <th>Timestamp</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="recordsBody">
          <tr><td colspan="3" style="text-align:center;color:#94a3b8;padding:16px;">Loading recent records...</td></tr>
        </tbody>
      </table>
    </div>

    <div class="footer-note">
      Powered by Google Apps Script & GitHub Pages • <a href="https://script.google.com/macros/s/AKfycbziRnTSLZ9QkGHN0sWxqpVoUUYXzsUnNaGuH0ePLmjTJEHWlQk1KAyEpmNONNuwlpOt/exec" target="_blank">View GAS Deployment ↗</a>
    </div>
  </div>

  <script>
    const GAS_WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbziRnTSLZ9QkGHN0sWxqpVoUUYXzsUnNaGuH0ePLmjTJEHWlQk1KAyEpmNONNuwlpOt/exec';
    const STORAGE_KEY = 'staff_attendance_records_v1';

    function updateClock() {
      const now = new Date();
      const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
      const months = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
      const y = now.getFullYear();
      const m = months[now.getMonth()];
      const d = now.getDate();
      const day = days[now.getDay()];
      const hh = String(now.getHours()).padStart(2, '0');
      const mm = String(now.getMinutes()).padStart(2, '0');
      const ss = String(now.getSeconds()).padStart(2, '0');

      document.getElementById('clockDate').textContent = day + ', ' + m + ' ' + d + ', ' + y;
      document.getElementById('clockTime').textContent = hh + ':' + mm + ':' + ss;
    }
    setInterval(updateClock, 1000);
    updateClock();

    function handleNameChange(val) {
      const customInput = document.getElementById('customNameInput');
      if (val === '__custom__') {
        customInput.style.display = 'block';
        customInput.focus();
      } else {
        customInput.style.display = 'none';
      }
    }

    window.addEventListener('DOMContentLoaded', function() {
      const savedName = localStorage.getItem('gas_staff_name');
      if (savedName) {
        const select = document.getElementById('empName');
        let matched = false;
        for (let i = 0; i < select.options.length; i++) {
          if (select.options[i].value === savedName) {
            select.value = savedName;
            matched = true;
            break;
          }
        }
        if (!matched) {
          select.value = '__custom__';
          const customInput = document.getElementById('customNameInput');
          customInput.style.display = 'block';
          customInput.value = savedName;
        }
      }
      renderLocalRecords();
    });

    function getSelectedName() {
      const select = document.getElementById('empName');
      if (select.value === '__custom__') {
        return document.getElementById('customNameInput').value.trim();
      }
      return select.value.trim();
    }

    function handleClock(clockType) {
      const name = getSelectedName();
      const noteInput = document.getElementById('empNote');
      const note = noteInput.value.trim();

      if (!name) {
        showStatus('⚠️ Please select or enter your Employee Name before submitting!', true);
        document.getElementById('empName').focus();
        return;
      }

      localStorage.setItem('gas_staff_name', name);
      setButtonsDisabled(true);
      showStatus('⏳ Recording attendance with GPS location, please wait...', false);

      if (navigator.vibrate) {
        navigator.vibrate(50);
      }

      getLocation(function(locStr) {
        const now = new Date();
        const y = now.getFullYear();
        const m = String(now.getMonth() + 1).padStart(2, '0');
        const d = String(now.getDate()).padStart(2, '0');
        const hh = String(now.getHours()).padStart(2, '0');
        const mm = String(now.getMinutes()).padStart(2, '0');
        const ss = String(now.getSeconds()).padStart(2, '0');
        const formattedTimestamp = y + '-' + m + '-' + d + ' ' + hh + ':' + mm + ':' + ss;

        const record = {
          name: name,
          type: clockType,
          note: note,
          location: locStr,
          timestamp: formattedTimestamp
        };

        // Save locally
        saveRecordLocally(record);

        // Attempt silent sync with Google Apps Script
        try {
          fetch(GAS_WEBAPP_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(record)
          }).catch(function(e) {
            console.log('Background sync note:', e);
          });
        } catch (e) {
          console.log('Fetch skipped:', e);
        }

        setTimeout(function() {
          setButtonsDisabled(false);
          noteInput.value = '';
          if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
          showStatus(
            '🎉 <strong>' + escapeHtml(record.type) + ' Recorded Successfully!</strong><br>' +
            '👤 Employee: ' + escapeHtml(record.name) + '<br>' +
            '🕒 Time: ' + escapeHtml(record.timestamp) + '<br>' +
            (record.note ? '📝 Notes: ' + escapeHtml(record.note) + '<br>' : '') +
            '📍 Location: ' + escapeHtml(record.location),
            false
          );
          renderLocalRecords();
        }, 400);
      });
    }

    function getLocation(callback) {
      if (!navigator.geolocation) {
        callback('Web Client');
        return;
      }
      let called = false;
      const timeout = setTimeout(function() {
        if (!called) {
          called = true;
          callback('Web Client');
        }
      }, 3000);

      navigator.geolocation.getCurrentPosition(
        function(pos) {
          if (!called) {
            called = true;
            clearTimeout(timeout);
            const lat = pos.coords.latitude.toFixed(4);
            const lng = pos.coords.longitude.toFixed(4);
            callback('GPS (' + lat + ', ' + lng + ')');
          }
        },
        function() {
          if (!called) {
            called = true;
            clearTimeout(timeout);
            callback('Web Client');
          }
        },
        { timeout: 3000, enableHighAccuracy: false }
      );
    }

    function saveRecordLocally(rec) {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        const list = raw ? JSON.parse(raw) : [];
        list.unshift(rec);
        if (list.length > 50) list.pop();
        localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
      } catch (e) {
        console.error('Local save error', e);
      }
    }

    function renderLocalRecords() {
      let records = [];
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) records = JSON.parse(raw);
      } catch (e) {}

      const tbody = document.getElementById('recordsBody');
      if (!records || records.length === 0) {
        tbody.innerHTML = '<tr><td colspan="3" style="text-align:center;color:#94a3b8;padding:16px;">No attendance records found yet. Click a button above to record your first clock-in!</td></tr>';
        return;
      }
      tbody.innerHTML = records.slice(0, 10).map(function(r) {
        let badgeClass = 'badge-in';
        const typeLower = (r.type || '').toLowerCase();
        if (typeLower.indexOf('out') !== -1 && typeLower.indexOf('office') === -1) {
          badgeClass = 'badge-out';
        } else if (typeLower.indexOf('office') !== -1 && typeLower.indexOf('back') === -1) {
          badgeClass = 'badge-warn';
        } else if (typeLower.indexOf('back') !== -1) {
          badgeClass = 'badge-purple';
        }

        return '<tr>' +
          '<td><strong>' + escapeHtml(r.name) + '</strong>' +
            (r.note ? '<div style="font-size:11px;color:#64748b;">' + escapeHtml(r.note) + '</div>' : '') +
            (r.location ? '<div style="font-size:10px;color:#94a3b8;">📍 ' + escapeHtml(r.location) + '</div>' : '') +
          '</td>' +
          '<td style="font-variant-numeric:tabular-nums;font-size:12px;">' + escapeHtml(r.timestamp) + '</td>' +
          '<td><span class="badge ' + badgeClass + '">' + escapeHtml(r.type || 'Clock In') + '</span></td>' +
        '</tr>';
      }).join('');
    }

    function exportCSV() {
      let records = [];
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) records = JSON.parse(raw);
      } catch (e) {}

      if (!records || records.length === 0) {
        alert('No attendance records available to export.');
        return;
      }

      let csv = 'Employee Name,Timestamp,Action Type,Notes,Location\r\n';
      records.forEach(function(r) {
        const line = [
          '"' + (r.name || '').replace(/"/g, '""') + '"',
          '"' + (r.timestamp || '').replace(/"/g, '""') + '"',
          '"' + (r.type || '').replace(/"/g, '""') + '"',
          '"' + (r.note || '').replace(/"/g, '""') + '"',
          '"' + (r.location || '').replace(/"/g, '""') + '"'
        ];
        csv += line.join(',') + '\r\n';
      });

      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.setAttribute('href', url);
      link.setAttribute('download', 'staff_attendance_' + new Date().toISOString().slice(0, 10) + '.csv');
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    function showStatus(html, isError) {
      const box = document.getElementById('statusBox');
      box.className = 'msg-box ' + (isError ? 'msg-error' : 'msg-success');
      box.innerHTML = html;
    }

    function setButtonsDisabled(disabled) {
      const btns = document.querySelectorAll('.btn-clock');
      btns.forEach(function(b) { b.disabled = disabled; });
    }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }
  </script>
</body>
</html>
